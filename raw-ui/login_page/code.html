<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | ProcureFlow</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<!-- Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "surface-dim": "#d2d9f4",
                "on-tertiary-fixed": "#301400",
                "inverse-on-surface": "#eef0ff",
                "error": "#ba1a1a",
                "surface-container-low": "#f2f3ff",
                "primary-container": "#8a4cfc",
                "secondary-fixed-dim": "#b9c7df",
                "on-secondary-fixed": "#0d1c2e",
                "tertiary-fixed-dim": "#ffb783",
                "secondary-fixed": "#d5e3fc",
                "on-primary-fixed": "#25005a",
                "surface-variant": "#dae2fd",
                "background": "#faf8ff",
                "surface-container": "#eaedff",
                "on-secondary-container": "#57657a",
                "on-primary-fixed-variant": "#5a00c6",
                "surface-tint": "#732ee4",
                "tertiary-container": "#b55d00",
                "outline": "#767586",
                "outline-variant": "#c7c4d7",
                "on-error-container": "#93000a",
                "secondary": "#515f74",
                "on-secondary-fixed-variant": "#3a485b",
                "on-tertiary-container": "#fffbff",
                "tertiary": "#904900",
                "primary-fixed": "#eaddff",
                "on-error": "#ffffff",
                "on-tertiary": "#ffffff",
                "on-secondary": "#ffffff",
                "surface-container-high": "#e2e7ff",
                "on-background": "#131b2e",
                "on-primary": "#ffffff",
                "inverse-primary": "#d2bbff",
                "on-tertiary-fixed-variant": "#703700",
                "tertiary-fixed": "#ffdcc5",
                "secondary-container": "#d5e3fc",
                "on-surface": "#131b2e",
                "surface-container-highest": "#dae2fd",
                "primary": "#712ae2",
                "primary-fixed-dim": "#d2bbff",
                "inverse-surface": "#283044",
                "surface": "#faf8ff",
                "surface-container-lowest": "#ffffff",
                "on-surface-variant": "#464554",
                "on-primary-container": "#fffbff",
                "surface-bright": "#faf8ff",
                "error-container": "#ffdad6"
              },
              fontFamily: {
                "headline": ["Manrope"],
                "body": ["Inter"],
                "label": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf8ff;
        }
        .font-manrope { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #712ae2 0%, #8a4cfc 100%);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-between">
<!-- Suppressed Shell: No TopAppBar for Login journey as per UX Goal -->
<main class="flex-grow flex items-center justify-center w-full px-6 py-12">
<!-- Background Decoration (Subtle Slate/Neutral Gradient defined in Design System) -->
<div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-surface-container-low blur-[120px] opacity-60"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-surface-variant blur-[150px] opacity-40"></div>
</div>
<!-- Centered Login Card -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl p-8 md:p-12 shadow-[0_20px_50px_-12px_rgba(19,27,46,0.08)] ring-1 ring-outline-variant/15">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-10">
<div class="flex items-center gap-2 mb-8">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="font-manrope font-extrabold text-2xl tracking-tighter text-on-background">ProcureFlow</span>
</div>
<h1 class="font-manrope text-2xl font-bold text-on-background mb-2">Welcome back</h1>
<p class="text-secondary text-sm font-body text-center">Enter your credentials to access your workspace</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label text-xs font-semibold text-on-surface-variant uppercase tracking-wider" for="email">Email address</label>
<div class="relative group">
<input class="w-full h-12 px-4 bg-surface-container-lowest border-none ring-1 ring-outline-variant/30 rounded-lg text-on-background placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-bright transition-all duration-200 outline-none" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label text-xs font-semibold text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-container-lowest border-none ring-1 ring-outline-variant/30 rounded-lg text-on-background placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-bright transition-all duration-200 outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface" id="remember" name="remember" type="checkbox"/>
<label class="ml-3 text-sm text-on-surface-variant font-body" for="remember">Remember me</label>
</div>
<!-- Action Button -->
<button class="w-full h-12 btn-gradient text-white font-manrope font-bold rounded-lg shadow-md active:scale-95 transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    Log In
                </button>
</form>
</div>
</main>
<!-- Shared Footer -->
<footer class="w-full py-12 bg-surface-container-low/50">
<div class="flex flex-col md:flex-row justify-between items-center w-full px-8 max-w-7xl mx-auto gap-4">
<p class="font-inter text-xs tracking-normal text-[#515f74]">
                © 2024 ProcureFlow Editorial. Architectural Lucidity in Procurement.
            </p>
<div class="flex gap-6">
<a class="font-inter text-xs tracking-normal text-[#515f74] hover:underline hover:text-[#712ae2] transition-colors duration-200" href="#">Privacy Policy</a>
<a class="font-inter text-xs tracking-normal text-[#515f74] hover:underline hover:text-[#712ae2] transition-colors duration-200" href="#">Terms of Service</a>
<a class="font-inter text-xs tracking-normal text-[#515f74] hover:underline hover:text-[#712ae2] transition-colors duration-200" href="#">Security</a>
<a class="font-inter text-xs tracking-normal text-[#515f74] hover:underline hover:text-[#712ae2] transition-colors duration-200" href="#">Support</a>
</div>
</div>
</footer>
</body></html>
